# NORDIC NEXUS – Tanzania Tender Scanner (cloud)
# Runs every 5 minutes on GitHub's computers (GitHub may start it a few minutes late when busy).
# Each source keeps its own interval from scanner/scanner_config.json (NeST 5 min, DDO/TANROADS 15, ...).
name: Tender scan

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tender-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Scan tender sources
        env:
          TZ: Africa/Dar_es_Salaam
          RECIPIENTS_JSON: ${{ secrets.RECIPIENTS_JSON }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BEEM_API_KEY: ${{ secrets.BEEM_API_KEY }}
          BEEM_SECRET_KEY: ${{ secrets.BEEM_SECRET_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        working-directory: scanner
        run: python tender_scanner.py --logfile logs/scan_log.txt || echo "scan finished with an error – see logs/scan_log.txt"

      - name: Save results
        run: |
          git config user.name "nexus-scanner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data scanner
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -m "Scan $(TZ=Africa/Dar_es_Salaam date '+%Y-%m-%d %H:%M') EAT"
          git push || (git pull --rebase -q && git push)
