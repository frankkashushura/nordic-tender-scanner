# One-off: checks candidate tender pages from GitHub's computers (nothing is added to the pipeline).
name: Probe candidate sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          TZ: Africa/Dar_es_Salaam
        run: python scanner/probe.py
      - name: Save
        run: |
          git config user.name "nexus-scanner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source_probe.json data/probe_html
          git commit -q -m "Source probe $(TZ=Africa/Dar_es_Salaam date '+%Y-%m-%d %H:%M') EAT" || exit 0
          git push || (git pull --rebase -q && git push)
