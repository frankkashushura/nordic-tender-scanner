# One-off check of candidate tender sites (run by hand). Writes data/probe_report.json. Adds nothing to the scan.
name: Probe tender sites

on:
  workflow_dispatch:
  push:
    paths:
      - "scanner/probe_sources.py"
      - ".github/workflows/probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        run: python scanner/probe_sources.py
      - name: Save report
        run: |
          git config user.name "nexus-scanner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe_report.json
          git commit -q -m "Probe report" || exit 0
          for i in 1 2 3 4 5; do git push -q && exit 0; git pull --rebase -X theirs -q || true; sleep $((i*4)); done
